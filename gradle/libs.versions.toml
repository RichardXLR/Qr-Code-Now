composeBom = "2026.08.00"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
navigation = "2.10.0"
camera = "1.6.2"
mlkit = "17.3.0"
room = "3.0.2"
sqlite = "2.7.0"
datastore = "1.2.1"
